[package]
name = "linera-bridge-e2e"
version = "0.0.1"
edition = "2021"
publish = false

# Separate workspace — avoids bollard version conflicts between
# testcontainers (>=0.19) and dockertest (0.17) in the main workspace.

[workspace]

[dependencies]
alloy = { git = "https://github.com/alloy-rs/alloy", tag = "v1.0.42", default-features = false, features = [
    "rpc-types-eth",
    "json-rpc",
    "contract",
    "reqwest",
    "signer-local",
] }
bcs = "0.1.6"
linera-base = { path = "../../../linera-base" }
linera-chain = { path = "../../../linera-chain" }
linera-core = { path = "../../../linera-core", default-features = false, features = ["wasmer"] }
linera-execution = { path = "../../../linera-execution" }
linera-rpc = { path = "../../../linera-rpc" }
linera-sdk = { path = "../../../linera-sdk", default-features = false }
linera-storage = { path = "../../../linera-storage", features = ["wasmer"] }
linera-views = { path = "../../../linera-views" }
reqwest = { version = "0.12", features = ["json"] }
serde_json = "1"
testcontainers = { version = "0.27", features = ["docker-compose"] }
tokio = { version = "1", features = ["full"] }
tonic = { version = "0.14.2", default-features = false, features = ["transport"] }
